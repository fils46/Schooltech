openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: M15-SchoolTech API — Plateforme de gestion scolaire
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentification et gestion des sessions
  - name: utilisateurs
    description: Gestion des utilisateurs
  - name: etablissements
    description: Gestion des établissements scolaires
  - name: stats
    description: Statistiques et tableaux de bord
  - name: eleves
    description: Gestion des dossiers élèves et inscriptions
  - name: classes
    description: Gestion des classes et niveaux

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Identifiants invalides ou compte désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Déconnexion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utilisateur"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Demande de réinitialisation du mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Email envoyé si le compte existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Réinitialisation du mot de passe avec token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Mot de passe réinitialisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Changement de mot de passe (premier login)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Mot de passe changé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /utilisateurs/creer:
    post:
      operationId: creerUtilisateur
      tags: [utilisateurs]
      summary: Créer un nouvel utilisateur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtilisateurInput"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilisateurCreatedResponse"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission insuffisante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /utilisateurs/liste:
    get:
      operationId: listerUtilisateurs
      tags: [utilisateurs]
      summary: Lister les utilisateurs de l'établissement
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: actif
          in: query
          schema:
            type: string
        - name: etablissement_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utilisateur"

  /utilisateurs/{id}/activer:
    put:
      operationId: activerUtilisateur
      tags: [utilisateurs]
      summary: Activer un compte utilisateur
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compte activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /utilisateurs/{id}/desactiver:
    put:
      operationId: desactiverUtilisateur
      tags: [utilisateurs]
      summary: Désactiver un compte utilisateur
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compte désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements:
    get:
      operationId: listerEtablissements
      tags: [etablissements]
      summary: Lister tous les établissements (dev only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des établissements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Etablissement"

    post:
      operationId: creerEtablissement
      tags: [etablissements]
      summary: Créer un établissement (dev only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtablissementInput"
      responses:
        "201":
          description: Établissement créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

  /etablissements/{id}:
    get:
      operationId: getEtablissement
      tags: [etablissements]
      summary: Détail d'un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de l'établissement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

    put:
      operationId: updateEtablissement
      tags: [etablissements]
      summary: Mettre à jour un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtablissementUpdate"
      responses:
        "200":
          description: Établissement mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

    delete:
      operationId: supprimerEtablissement
      tags: [etablissements]
      summary: Supprimer un établissement (dev only, aucun utilisateur actif)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Impossible de supprimer (utilisateurs actifs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements/{id}/activer:
    put:
      operationId: activerEtablissement
      tags: [etablissements]
      summary: Activer la licence et réactiver tous les comptes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements/{id}/desactiver:
    put:
      operationId: desactiverEtablissement
      tags: [etablissements]
      summary: Désactiver un établissement et suspendre ses comptes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stats/global:
    get:
      operationId: getStatsGlobal
      tags: [stats]
      summary: Statistiques globales (dev)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistiques globales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsGlobal"

  /stats/etablissement/{id}:
    get:
      operationId: getStatsEtablissement
      tags: [stats]
      summary: Statistiques d'un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques de l'établissement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsEtablissement"

  /eleves/inscrire:
    post:
      operationId: inscrireEleve
      tags: [eleves]
      summary: Inscrire un nouvel élève avec compte + parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscrireEleveInput"
      responses:
        "201":
          description: Élève inscrit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InscrireEleveResponse"

  /eleves/liste:
    get:
      operationId: listerEleves
      tags: [eleves]
      summary: Lister les élèves (paginé, filtré)
      security:
        - bearerAuth: []
      parameters:
        - name: statut
          in: query
          schema:
            type: string
        - name: annee_inscription
          in: query
          schema:
            type: integer
        - name: sexe
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste paginée d'élèves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevesListeResponse"

  /eleves/recherche:
    get:
      operationId: rechercherEleves
      tags: [eleves]
      summary: Recherche d'élèves par texte libre
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: statut
          in: query
          schema:
            type: string
        - name: annee
          in: query
          schema:
            type: integer
        - name: sexe
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EleveResume"

  /eleves/{id}:
    get:
      operationId: getEleve
      tags: [eleves]
      summary: Détail complet d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dossier élève complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EleveDetail"
    put:
      operationId: modifierEleve
      tags: [eleves]
      summary: Modifier les informations d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierEleveInput"
      responses:
        "200":
          description: Élève mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EleveResume"
    delete:
      operationId: supprimerEleve
      tags: [eleves]
      summary: Soft delete d'un élève (inactif)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Élève désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/statut:
    put:
      operationId: changerStatutEleve
      tags: [eleves]
      summary: Changer le statut d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangerStatutInput"
      responses:
        "200":
          description: Statut modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/lier-parent:
    post:
      operationId: lierParent
      tags: [eleves]
      summary: Lier un parent existant à un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LierParentInput"
      responses:
        "201":
          description: Parent lié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/delier-parent/{parentId}:
    delete:
      operationId: delierParent
      tags: [eleves]
      summary: Délier un parent d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: parentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent délié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/documents:
    get:
      operationId: listerDocumentsEleve
      tags: [eleves]
      summary: Lister les documents d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentEleve"

  /eleves/{id}/documents/{docId}:
    delete:
      operationId: supprimerDocumentEleve
      tags: [eleves]
      summary: Supprimer un document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /classes/liste:
    get:
      operationId: listerClasses
      tags: [classes]
      summary: Lister les classes
      security:
        - bearerAuth: []
      parameters:
        - name: annee_scolaire
          in: query
          schema:
            type: integer
        - name: annee_scolaire_id
          in: query
          schema:
            type: string
        - name: niveau
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste des classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassesListeResponse"

  /classes/creer:
    post:
      operationId: creerClasse
      tags: [classes]
      summary: Créer une nouvelle classe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClasseInput"
      responses:
        "201":
          description: Classe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classe"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}:
    put:
      operationId: modifierClasse
      tags: [classes]
      summary: Modifier une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClasseInput"
      responses:
        "200":
          description: Classe mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classe"
        "404":
          description: Classe non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: supprimerClasse
      tags: [classes]
      summary: Supprimer une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Classe supprimée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Classe non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}/detail:
    get:
      operationId: getClasseDetail
      tags: [classes]
      summary: Détail d'une classe (avec élèves et professeurs)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de la classe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClasseDetail"
        "404":
          description: Classe non trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}/eleves:
    get:
      operationId: getElevesClasse
      tags: [classes]
      summary: Liste des élèves d'une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Élèves de la classe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevesClasseResponse"

  /classes/{id}/statistiques:
    get:
      operationId: getStatistiquesClasse
      tags: [classes]
      summary: Statistiques d'une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques de la classe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClasseStatistiques"

  /classes/{id}/affecter-eleve:
    post:
      operationId: affecterEleve
      tags: [classes]
      summary: Affecter un élève à une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffecterEleveInput"
      responses:
        "201":
          description: Élève affecté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Erreur d'affectation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}/retirer-eleve/{eleveId}:
    delete:
      operationId: retirerEleve
      tags: [classes]
      summary: Retirer un élève d'une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: eleveId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Élève retiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /classes/{id}/affecter-professeur:
    post:
      operationId: affecterProfesseur
      tags: [classes]
      summary: Affecter un professeur à une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffecterProfesseurInput"
      responses:
        "201":
          description: Professeur affecté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Erreur d'affectation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}/retirer-professeur/{profId}:
    delete:
      operationId: retirerProfesseur
      tags: [classes]
      summary: Retirer un professeur d'une classe
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: profId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Professeur retiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /classes/montee:
    post:
      operationId: monteeDeClasse
      tags: [classes]
      summary: Montée de classe (passage année scolaire suivante)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonteeClasseInput"
      responses:
        "200":
          description: Montée effectuée
          content:
            application/json:
              schema:
