components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
      required:
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokens:
      type: object
      required: [token, refreshToken, utilisateur]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        utilisateur:
          $ref: "#/components/schemas/Utilisateur"
        premierLogin:
          type: boolean

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [ancienPassword, nouveauPassword]
      properties:
        ancienPassword:
          type: string
        nouveauPassword:
          type: string
          minLength: 8

    UtilisateurInput:
      type: object
      required: [nom, email, role]
      properties:
        etablissement_id:
          type: ["string", "null"]
        nom:
          type: string
        prenoms:
          type: ["string", "null"]
        email:
          type: string
          format: email
        telephone:
          type: ["string", "null"]
        role:
          type: string
          enum: [dev, directeur, censeur, professeur, eleve, parent]

    UtilisateurCreatedResponse:
      type: object
      required: [utilisateur, passwordTemporaire]
      properties:
        utilisateur:
          $ref: "#/components/schemas/Utilisateur"
        passwordTemporaire:
          type: string

    Utilisateur:
      type: object
      required: [id, nom, email, role, actif]
      properties:
        id:
          type: string
        etablissement_id:
          type: ["string", "null"]
        nom:
          type: string
        prenoms:
          type: ["string", "null"]
        email:
          type: string
        telephone:
          type: ["string", "null"]
        role:
          type: string
          enum: [dev, directeur, censeur, professeur, eleve, parent]
        actif:
          type: boolean
        premier_login:
          type: boolean
        created_at:
          type: string
          format: date-time

    Etablissement:
      type: object
      required: [id, nom, licence_active]
      properties:
        id:
          type: string
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        licence_active:
          type: boolean
        date_expiration_licence:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        nbUtilisateurs:
          type: ["integer", "null"]

    EtablissementInput:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        date_expiration_licence:
          type: ["string", "null"]

    EtablissementUpdate:
      type: object
      properties:
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        licence_active:
          type: boolean
        date_expiration_licence:
          type: ["string", "null"]

    StatsGlobal:
      type: object
      required: [totalEtablissements, totalUtilisateurs, etablissementsActifs, licencesExpirees]
      properties:
        totalEtablissements:
          type: integer
        totalUtilisateurs:
          type: integer
        etablissementsActifs:
          type: integer
        licencesExpirees:
          type: integer
        totalElevesActifs:
          type: integer
        inscriptionsAnneeEnCours:
          type: integer
        repartitionRoles:
          type: array
          items:
            $ref: "#/components/schemas/RoleCount"

    StatsEtablissement:
