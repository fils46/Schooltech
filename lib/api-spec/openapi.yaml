components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
      required:
        - message


    ConfigurerCriteresBody:
      type: object
      required: [annee_scolaire_id, moyenne_admission]
      properties:
        annee_scolaire_id: { type: string }
        classe_id: { type: ["string", "null"] }
        moyenne_admission: { type: number }
        nb_matieres_eliminatoires_max: { type: integer }
        moyenne_eliminatoire: { type: ["number", "null"] }
        conseil_obligatoire: { type: boolean }
        notes_criteres: { type: ["string", "null"] }

    CritereAdmissionResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            id: { type: string }
            etablissement_id: { type: string }
            annee_scolaire_id: { type: string }
            classe_id: { type: ["string", "null"] }
            moyenne_admission: { type: string }
            nb_matieres_eliminatoires_max: { type: integer }
            moyenne_eliminatoire: { type: ["string", "null"] }
            conseil_obligatoire: { type: boolean }
            notes_criteres: { type: ["string", "null"] }

    CriteresListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            global:
              type: ["object", "null"]
              properties:
                id: { type: string }
                moyenne_admission: { type: string }
                nb_matieres_eliminatoires_max: { type: integer }
                moyenne_eliminatoire: { type: ["string", "null"] }
                conseil_obligatoire: { type: boolean }
                notes_criteres: { type: ["string", "null"] }
            par_classe:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  classe_id: { type: string }
                  moyenne_admission: { type: string }
                  nb_matieres_eliminatoires_max: { type: integer }
                  conseil_obligatoire: { type: boolean }

    ResultatEleve:
      type: object
      properties:
        eleve_id: { type: string }
        nom: { type: string }
        prenom: { type: string }
        matricule: { type: ["string", "null"] }
        moyenne_t1: { type: ["number", "null"] }
        moyenne_t2: { type: ["number", "null"] }
        moyenne_t3: { type: ["number", "null"] }
        moyenne_annuelle: { type: ["number", "null"] }
        nb_matieres_elim: { type: integer }
        bulletin_incomplet: { type: boolean }
        proposition_auto: { type: string }
        decision_enregistree: { type: ["string", "null"] }
        classe_destination_id: { type: ["string", "null"] }
        classe_destination_nom: { type: ["string", "null"] }
        decision_id: { type: ["string", "null"] }
        parent_notifie: { type: boolean }

    ResultatsClasseResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            classe:
              type: object
              properties:
                id: { type: string }
                nom: { type: string }
                niveau: { type: string }
                est_terminale: { type: boolean }
            criteres:
              type: object
              properties:
                moyenne_admission: { type: string }
                nb_matieres_eliminatoires_max: { type: integer }
                moyenne_eliminatoire: { type: ["string", "null"] }
            eleves:
              type: array
              items:
                $ref: "#/components/schemas/ResultatEleve"
            stats:
              type: object
              properties:
                total: { type: integer }
                admis: { type: integer }
                redoublants: { type: integer }
                sans_decision: { type: integer }

    EnregistrerDecisionBody:
      type: object
      required: [eleve_id, classe_id, annee_scolaire_id, decision, date_decision]
      properties:
        eleve_id: { type: string }
        classe_id: { type: string }
        annee_scolaire_id: { type: string }
        decision: { type: string, enum: [admis, redoublant, exclu, oriente_sortie, admis_avec_reserve] }
        classe_destination_id: { type: ["string", "null"] }
        filiere_destination_id: { type: ["string", "null"] }
        motif: { type: ["string", "null"] }
        conseil_classe_id: { type: ["string", "null"] }
        date_decision: { type: string }
        moyenne_annuelle: { type: ["number", "null"] }

    DecisionFinAnneeResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            id: { type: string }
            eleve_id: { type: string }
            decision: { type: string }
            classe_destination_id: { type: ["string", "null"] }
            moyenne_annuelle: { type: ["string", "null"] }
            parent_notifie: { type: boolean }

    DecisionsMasseBody:
      type: object
      required: [annee_scolaire_id, classe_id, decisions]
      properties:
        annee_scolaire_id: { type: string }
        classe_id: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [eleve_id, decision]
            properties:
              eleve_id: { type: string }
              decision: { type: string }
              classe_destination_id: { type: ["string", "null"] }
              motif: { type: ["string", "null"] }

    DecisionsMasseResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            nb_enregistrees: { type: integer }
            erreurs:
              type: array
              items: { type: string }

    PromouvoirBody:
      type: object
      required: [annee_scolaire_source_id, annee_scolaire_destination_id, classe_source_id]
      properties:
        annee_scolaire_source_id: { type: string }
        annee_scolaire_destination_id: { type: string }
        classe_source_id: { type: string }

    PromotionResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            promotion_id: { type: string }
            stats:
              type: object
              properties:
                promus: { type: integer }
                redoublants: { type: integer }
                exclus: { type: integer }
                sortie: { type: integer }

    NotifierBody:
      type: object
      required: [annee_scolaire_id]
