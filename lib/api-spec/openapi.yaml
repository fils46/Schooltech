        count:
          type: integer

    EleveResume:
      type: object
      required: [id, matricule, nom, prenoms, sexe, annee_inscription, statut]
      properties:
        id:
          type: string
        etablissement_id:
          type: string
        utilisateur_id:
          type: ["string", "null"]
        matricule:
          type: string
        nom:
          type: string
        prenoms:
          type: string
        date_naissance:
          type: string
        lieu_naissance:
