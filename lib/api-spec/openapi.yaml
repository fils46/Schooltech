openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: M15-SchoolTech API — Plateforme de gestion scolaire
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentification et gestion des sessions
  - name: utilisateurs
    description: Gestion des utilisateurs
  - name: etablissements
    description: Gestion des établissements scolaires
  - name: stats
    description: Statistiques et tableaux de bord
  - name: eleves
    description: Gestion des dossiers élèves et inscriptions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Identifiants invalides ou compte désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Déconnexion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utilisateur"
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Demande de réinitialisation du mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Email envoyé si le compte existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Réinitialisation du mot de passe avec token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Mot de passe réinitialisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Changement de mot de passe (premier login)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Mot de passe changé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /utilisateurs/creer:
    post:
      operationId: creerUtilisateur
      tags: [utilisateurs]
      summary: Créer un nouvel utilisateur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtilisateurInput"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilisateurCreatedResponse"
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission insuffisante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /utilisateurs/liste:
    get:
      operationId: listerUtilisateurs
      tags: [utilisateurs]
      summary: Lister les utilisateurs de l'établissement
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: actif
          in: query
          schema:
            type: string
        - name: etablissement_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utilisateur"

  /utilisateurs/{id}/activer:
    put:
      operationId: activerUtilisateur
      tags: [utilisateurs]
      summary: Activer un compte utilisateur
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compte activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /utilisateurs/{id}/desactiver:
    put:
      operationId: desactiverUtilisateur
      tags: [utilisateurs]
      summary: Désactiver un compte utilisateur
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compte désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements:
    get:
      operationId: listerEtablissements
      tags: [etablissements]
      summary: Lister tous les établissements (dev only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des établissements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Etablissement"

    post:
      operationId: creerEtablissement
      tags: [etablissements]
      summary: Créer un établissement (dev only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtablissementInput"
      responses:
        "201":
          description: Établissement créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

  /etablissements/{id}:
    get:
      operationId: getEtablissement
      tags: [etablissements]
      summary: Détail d'un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détail de l'établissement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

    put:
      operationId: updateEtablissement
      tags: [etablissements]
      summary: Mettre à jour un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtablissementUpdate"
      responses:
        "200":
          description: Établissement mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etablissement"

    delete:
      operationId: supprimerEtablissement
      tags: [etablissements]
      summary: Supprimer un établissement (dev only, aucun utilisateur actif)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Impossible de supprimer (utilisateurs actifs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements/{id}/activer:
    put:
      operationId: activerEtablissement
      tags: [etablissements]
      summary: Activer la licence et réactiver tous les comptes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /etablissements/{id}/desactiver:
    put:
      operationId: desactiverEtablissement
      tags: [etablissements]
      summary: Désactiver un établissement et suspendre ses comptes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Établissement désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stats/global:
    get:
      operationId: getStatsGlobal
      tags: [stats]
      summary: Statistiques globales (dev)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistiques globales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsGlobal"

  /stats/etablissement/{id}:
    get:
      operationId: getStatsEtablissement
      tags: [stats]
      summary: Statistiques d'un établissement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques de l'établissement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsEtablissement"

  /eleves/inscrire:
    post:
      operationId: inscrireEleve
      tags: [eleves]
      summary: Inscrire un nouvel élève avec compte + parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscrireEleveInput"
      responses:
        "201":
          description: Élève inscrit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InscrireEleveResponse"

  /eleves/liste:
    get:
      operationId: listerEleves
      tags: [eleves]
      summary: Lister les élèves (paginé, filtré)
      security:
        - bearerAuth: []
      parameters:
        - name: statut
          in: query
          schema:
            type: string
        - name: annee_inscription
          in: query
          schema:
            type: integer
        - name: sexe
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste paginée d'élèves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevesListeResponse"

  /eleves/recherche:
    get:
      operationId: rechercherEleves
      tags: [eleves]
      summary: Recherche d'élèves par texte libre
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: statut
          in: query
          schema:
            type: string
        - name: annee
          in: query
          schema:
            type: integer
        - name: sexe
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Résultats de recherche
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EleveResume"

  /eleves/{id}:
    get:
      operationId: getEleve
      tags: [eleves]
      summary: Détail complet d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dossier élève complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EleveDetail"
    put:
      operationId: modifierEleve
      tags: [eleves]
      summary: Modifier les informations d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierEleveInput"
      responses:
        "200":
          description: Élève mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EleveResume"
    delete:
      operationId: supprimerEleve
      tags: [eleves]
      summary: Soft delete d'un élève (inactif)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Élève désactivé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/statut:
    put:
      operationId: changerStatutEleve
      tags: [eleves]
      summary: Changer le statut d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangerStatutInput"
      responses:
        "200":
          description: Statut modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/lier-parent:
    post:
      operationId: lierParent
      tags: [eleves]
      summary: Lier un parent existant à un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LierParentInput"
      responses:
        "201":
          description: Parent lié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/delier-parent/{parentId}:
    delete:
      operationId: delierParent
      tags: [eleves]
      summary: Délier un parent d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: parentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent délié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /eleves/{id}/documents:
    get:
      operationId: listerDocumentsEleve
      tags: [eleves]
      summary: Lister les documents d'un élève
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentEleve"

  /eleves/{id}/documents/{docId}:
    delete:
      operationId: supprimerDocumentEleve
      tags: [eleves]
      summary: Supprimer un document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document supprimé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
      required:
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokens:
      type: object
      required: [token, refreshToken, utilisateur]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        utilisateur:
          $ref: "#/components/schemas/Utilisateur"
        premierLogin:
          type: boolean

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [ancienPassword, nouveauPassword]
      properties:
        ancienPassword:
          type: string
        nouveauPassword:
          type: string
          minLength: 8

    UtilisateurInput:
      type: object
      required: [nom, email, role]
      properties:
        etablissement_id:
          type: ["string", "null"]
        nom:
          type: string
        prenoms:
          type: ["string", "null"]
        email:
          type: string
          format: email
        telephone:
          type: ["string", "null"]
        role:
          type: string
          enum: [dev, directeur, censeur, professeur, eleve, parent]

    UtilisateurCreatedResponse:
      type: object
      required: [utilisateur, passwordTemporaire]
      properties:
        utilisateur:
          $ref: "#/components/schemas/Utilisateur"
        passwordTemporaire:
          type: string

    Utilisateur:
      type: object
      required: [id, nom, email, role, actif]
      properties:
        id:
          type: string
        etablissement_id:
          type: ["string", "null"]
        nom:
          type: string
        prenoms:
          type: ["string", "null"]
        email:
          type: string
        telephone:
          type: ["string", "null"]
        role:
          type: string
          enum: [dev, directeur, censeur, professeur, eleve, parent]
        actif:
          type: boolean
        premier_login:
          type: boolean
        created_at:
          type: string
          format: date-time

    Etablissement:
      type: object
      required: [id, nom, licence_active]
      properties:
        id:
          type: string
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        licence_active:
          type: boolean
        date_expiration_licence:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        nbUtilisateurs:
          type: ["integer", "null"]

    EtablissementInput:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        date_expiration_licence:
          type: ["string", "null"]

    EtablissementUpdate:
      type: object
      properties:
        nom:
          type: string
        type:
          type: ["string", "null"]
          enum: [college, lycee, college_lycee, null]
        ville:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        nombre_eleves_max:
          type: ["integer", "null"]
        licence_active:
          type: boolean
        date_expiration_licence:
          type: ["string", "null"]

    StatsGlobal:
      type: object
      required: [totalEtablissements, totalUtilisateurs, etablissementsActifs, licencesExpirees]
      properties:
        totalEtablissements:
          type: integer
        totalUtilisateurs:
          type: integer
        etablissementsActifs:
          type: integer
        licencesExpirees:
          type: integer
        totalElevesActifs:
          type: integer
        inscriptionsAnneeEnCours:
          type: integer
        repartitionRoles:
          type: array
          items:
            $ref: "#/components/schemas/RoleCount"

    StatsEtablissement:
      type: object
      required: [etablissement_id, totalUtilisateurs, totalActifs]
      properties:
        etablissement_id:
          type: string
        totalUtilisateurs:
          type: integer
        totalActifs:
          type: integer
        repartitionRoles:
          type: array
          items:
            $ref: "#/components/schemas/RoleCount"

    RoleCount:
      type: object
      required: [role, count]
      properties:
        role:
          type: string
        count:
          type: integer

    EleveResume:
      type: object
      required: [id, matricule, nom, prenoms, sexe, annee_inscription, statut]
      properties:
        id:
          type: string
        etablissement_id:
          type: string
        utilisateur_id:
          type: ["string", "null"]
        matricule:
          type: string
        nom:
          type: string
        prenoms:
          type: string
        date_naissance:
          type: string
        lieu_naissance:
          type: ["string", "null"]
        sexe:
          type: string
        photo_url:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        situation_familiale:
          type: ["string", "null"]
        annee_inscription:
          type: integer
        statut:
          type: string
        created_at:
          type: string
          format: date-time

    EleveDetail:
      allOf:
        - $ref: "#/components/schemas/EleveResume"
        - type: object
          properties:
            parents:
              type: array
              items:
                $ref: "#/components/schemas/ParentLie"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/DocumentEleve"
            historique_statut:
              type: array
              items:
                type: object
                properties:
                  statut:
                    type: string
                  motif:
                    type: ["string", "null"]
                  date:
                    type: string

    ParentLie:
      type: object
      properties:
        lien_id:
          type: string
        utilisateur_id:
          type: string
        nom:
          type: string
        prenoms:
          type: ["string", "null"]
